name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Install Android SDK 36
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-36 build-tools;36.0.0'

    - name: Build with Gradle and run tests
      run: ./gradlew test assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Install Android SDK 36
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-36 build-tools;36.0.0'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode upload keystore
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
          echo "Missing required GitHub secret: ANDROID_KEYSTORE_BASE64" >&2
          exit 1
        fi
        printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kharcha-upload.jks"
        echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/kharcha-upload.jks" >> "$GITHUB_ENV"

    - name: Build signed Play bundle and APK
      env:
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        for secret_name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
          if [ -z "${!secret_name}" ]; then
            echo "Missing required GitHub secret: $secret_name" >&2
            exit 1
          fi
        done
        ./gradlew bundleRelease assembleRelease \
          -PappVersionCode="$GITHUB_RUN_NUMBER" \
          -PappVersionName="1.0.$GITHUB_RUN_NUMBER"

    - name: Verify signed APK
      run: |
        APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
        "$APK_SIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
        jarsigner -verify app/build/outputs/bundle/release/app-release.aab

    - name: Upload signed release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kharcha-release-${{ github.run_number }}
        path: |
          app/build/outputs/bundle/release/app-release.aab
          app/build/outputs/apk/release/app-release.apk
        if-no-files-found: error
