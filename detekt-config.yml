build:
  maxIssues: 0

style:
  MaxLineLength:
    active: true
    maxLineLength: 120
  MagicNumber:
    active: false

naming:
  FunctionNaming:
    active: true
    ignoreAnnotated: ['Composable']

complexity:
  TooManyFunctions:
    active: true
    thresholdInFiles: 30
    thresholdInClasses: 20
    thresholdInInterfaces: 20
    thresholdInObjects: 30
    thresholdInEnums: 20
