name: Android release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Prepare upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Set ANDROID_KEYSTORE_BASE64 in GitHub Actions secrets" >&2; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kharcha-upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/kharcha-upload.jks" >> "$GITHUB_ENV"

      - name: Build signed APK and Play bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Set ANDROID_KEYSTORE_PASSWORD in GitHub Actions secrets" >&2; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Set ANDROID_KEY_ALIAS in GitHub Actions secrets" >&2; exit 1; }
          ./gradlew assembleRelease bundleRelease \
            -PappVersionCode="$GITHUB_RUN_NUMBER" \
            -PappVersionName="1.0.$GITHUB_RUN_NUMBER"

      - uses: actions/upload-artifact@v4
        with:
          name: kharcha-release-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
